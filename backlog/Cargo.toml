[package]
name = "backlog"
version = "0.1.0"
edition = "2024"
autoexamples = false
autotests = false
autobenches = false

[lib]
path = "src/lib.rs"

[[test]]
name = "loader_test"
path = "tests/loader_test.rs"

[[test]]
name = "live_smoke"
path = "tests/live_smoke.rs"

[[bin]]
name = "backlog-regenerate"
path = "src/bin/regenerate.rs"

[dependencies]
ingress = { path = "../ingress" }
dag-rdf = { path = "../dag_rdf" }
turtle = { path = "../turtle" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
chrono = "0.4"
log = "0.4"
env_logger = "0.10"
thiserror = "2"

[dev-dependencies]
shacl = { path = "../shacl" }
