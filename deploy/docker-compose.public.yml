# Public deployment overlay: dagalog + backlog_endpoint, gated by Google
# sign-in at the edge (oauth2-proxy) behind Caddy's automatic HTTPS.
#
# This is deliberately a SEPARATE compose file from the repo root's
# docker-compose.yml (which stays the simple, local/trusted single-service
# setup) rather than an extension of it -- see docs/deploy/PUBLIC_DEPLOYMENT.md
# for the full prerequisites (a domain name pointed at this host, a Google
# OAuth client) and step-by-step setup this file assumes.
#
# Usage (from the repo root, once the prerequisites in PUBLIC_DEPLOYMENT.md
# are met and deploy/.env is filled in from deploy/.env.example):
#   docker compose -f deploy/docker-compose.public.yml --env-file deploy/.env up -d
#
# Only `caddy` publishes ports to the host (80/443). `dagalog`,
# `backlog-endpoint`, and `oauth2-proxy` are reachable only on the internal
# Docker network `edge` -- there is no host port mapping for them here, so
# even a misconfigured firewall can't accidentally expose the unauthenticated
# dagalog/backlog-endpoint ports directly. Caddy is the only ingress.

services:
  dagalog:
    build:
      context: ..
      dockerfile: Dockerfile
    volumes:
      - ../data:/data
    command: ["--serve", "--read-only", "--data", "/data/dataset.ttl"]
    networks: [edge]
    restart: unless-stopped

  backlog-endpoint:
    build:
      context: ..
      dockerfile: backlog_endpoint/Dockerfile
    environment:
      BACKLOG_ENDPOINT_PORT: "3031"
      # This value is templated verbatim into window.SPARQL_ENDPOINT and
      # fetch()'d directly by the browser (see backlog_endpoint/src/lib.rs
      # and backlog_frontend.html's sparqlFetch) -- it is NOT server-side
      # only. It must therefore be a relative, same-origin path the browser
      # can actually reach: the in-cluster hostname "dagalog" only resolves
      # inside the Docker network, never from a real browser. Caddy's
      # catch-all route already forwards /sparql to dagalog:3030 behind the
      # same forward_auth gate (see Caddyfile).
      BACKLOG_ENDPOINT_SPARQL_ENDPOINT: "/sparql"
    networks: [edge]
    restart: unless-stopped

  # Self-hosted identity provider, replacing Google (#532). Runs entirely on
  # this server (EU-hosted) -- no third-party identity account, and unlike
  # Google, Keycloak lets us define real app roles (dagalog.Admin/Read/Write)
  # that dagalog's own AuthConfig::Oidc mode can check, see docs/plans/AUTH.md.
  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: "${KEYCLOAK_DB_PASSWORD}"
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks: [edge]
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: ["start", "--http-enabled=true", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://keycloak-db:5432/keycloak"
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD}"
      # Bootstrap admin account, for the one-time step of creating your own
      # real user account through the admin console -- not meant for
      # day-to-day sign-in.
      KEYCLOAK_ADMIN: "${KEYCLOAK_ADMIN_USER}"
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD}"
      # Served under a path (not its own subdomain) via the same Caddy
      # instance/domain/cert as everything else -- see Caddyfile's /auth/*
      # route. KC_PROXY_HEADERS tells Keycloak to trust Caddy's
      # X-Forwarded-* headers (Caddy terminates TLS; Keycloak itself only
      # ever speaks plain HTTP inside the `edge` network).
      KC_HOSTNAME: "https://${PUBLIC_DOMAIN}/auth"
      KC_HTTP_RELATIVE_PATH: "/auth"
      KC_PROXY_HEADERS: "xforwarded"
    volumes:
      - ./keycloak/dagalog-realm.json:/opt/keycloak/data/import/dagalog-realm.json:ro
    networks: [edge]
    restart: unless-stopped
    depends_on: [keycloak-db]

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    environment:
      # Phase 1 (#532): still Google, unchanged, while Keycloak is stood up
      # and verified in parallel. Switched to Keycloak's OIDC provider only
      # once that's confirmed working end-to-end.
      OAUTH2_PROXY_PROVIDER: "google"
      OAUTH2_PROXY_CLIENT_ID: "${GOOGLE_OAUTH_CLIENT_ID}"
      OAUTH2_PROXY_CLIENT_SECRET: "${GOOGLE_OAUTH_CLIENT_SECRET}"
      OAUTH2_PROXY_COOKIE_SECRET: "${OAUTH2_PROXY_COOKIE_SECRET}"
      # Restrict sign-in to your own account(s) -- comma-separated emails.
      # This is the actual access-control decision: anyone with a Google
      # account can authenticate to Google, but only emails listed here are
      # let through oauth2-proxy's own allow/deny gate.
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE: "/etc/oauth2-proxy/authenticated-emails.txt"
      OAUTH2_PROXY_COOKIE_DOMAINS: "${PUBLIC_DOMAIN}"
      OAUTH2_PROXY_WHITELIST_DOMAINS: "${PUBLIC_DOMAIN}"
      OAUTH2_PROXY_REDIRECT_URL: "https://${PUBLIC_DOMAIN}/oauth2/callback"
      OAUTH2_PROXY_UPSTREAMS: "static://200"
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
    volumes:
      - ./authenticated-emails.txt:/etc/oauth2-proxy/authenticated-emails.txt:ro
    networks: [edge]
    restart: unless-stopped
    depends_on: [keycloak]

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Vocabulary/ontology Turtle files, served directly at their own
      # namespace IRIs (/ns/backlog, /ns/agentprov) -- see #441 and
      # docs/plans/DEREFERENCEABLE_URIS_441_PLAN.md.
      - ../backlog/ontology:/srv/vocab:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      PUBLIC_DOMAIN: "${PUBLIC_DOMAIN}"
    networks: [edge]
    restart: unless-stopped

networks:
  edge:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  keycloak_db_data:
