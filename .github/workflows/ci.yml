name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Edition 2024 requires Rust ≥ 1.85.
  RUST_VERSION: "1.95"

jobs:
  # ── Format ──────────────────────────────────────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  # ── Lint (clippy) ───────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ── Unit tests ──────────────────────────────────────────────────────────────
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (debug)
        run: cargo test --workspace

  # ── Release-mode tests ──────────────────────────────────────────────────────
  # Catches optimisation-dependent bugs and verifies the release profile compiles.
  test-release:
    name: Tests (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          # Keep release cache separate so it doesn't evict the debug cache.
          key: release
      - name: cargo test (release)
        run: cargo test --workspace --release

  # ── Documentation build ─────────────────────────────────────────────────────
  # Catches broken intra-doc links and missing items before they hit main.
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc
        run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"

  # ── Security audit ──────────────────────────────────────────────────────────
  # Checks all dependencies against the RustSec advisory database.
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ── Provenance/backlog SHACL validation ─────────────────────────────────────
  # Dedicated job so a shape violation shows up as its own named status check
  # instead of being buried inside the generic "Unit & Integration Tests" job.
  # Covers `provenance/summaries/*.ttl` against `backlog/ontology/agentprov-shapes.ttl`
  # (tests/provenance_queries.rs and tests/agentprov_ontology.rs) and the backlog
  # example snapshot against `backlog/ontology/shapes.ttl` (tests/backlog_ontology.rs).
  provenance-shacl:
    name: Provenance SHACL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: provenance-shacl
      - name: cargo test — provenance & backlog SHACL validation
        run: cargo test --test provenance_queries --test backlog_ontology --test agentprov_ontology

  # ── Caddyfile syntax validation ─────────────────────────────────────────────
  # deploy/Caddyfile has grown several hand-edited routing blocks (#439, #441,
  # #494, #567) with no automated syntax check anywhere in this repo (#603).
  # Runs `caddy validate` against the real file via the official caddy:2-alpine
  # image so a Caddyfile syntax error is caught in CI, not at actual deploy
  # time. Deliberately unconditional (not gated on `paths:`) since the file's
  # correctness can also depend on other deploy/ changes (e.g. env vars it
  # references), and the check itself is a single fast docker run.
  caddyfile-validate:
    name: Caddyfile Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: caddy validate
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e PUBLIC_DOMAIN=dagalog.example.com \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  # ── Performance tests (IMF + Gene Ontology) ─────────────────────────────────
  # Downloads imf.ttl and go.owl (a dated, archived release — see
  # scripts/download_test_ontologies.sh for why it's pinned rather than the
  # rolling "current" snapshot), converts go.owl to Turtle with Apache Jena's
  # riot, and runs both ontologies' pipeline tests, all in release mode (debug
  # is dramatically slower for Gene Ontology — 25s on a 2021 ThinkPad vs. ~2s
  # release on a recent Mac — ubuntu-latest's 16GB/4-core runner has plenty of
  # headroom, unlike the 3.7GB production box these used to be too risky to
  # run on; see #559/#779).
  #
  # One job, not two: the dominant cost for either ontology is compiling the
  # performance test binary (and its dependency graph) in release mode, not
  # running the already-compiled test — splitting IMF and Gene Ontology into
  # separate jobs paid that compile cost twice for no benefit. The build is
  # its own step (--no-run) so its time shows separately from each test's run
  # time in the Actions UI, making a future runtime regression in either
  # ontology's pipeline easy to spot without rebuild noise included.
  # Kept as its own job (not merged into test-release) so a slow download does
  # not block the core test suite.
  performance-tests:
    name: Performance Tests (IMF + Gene Ontology)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: performance-tests
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Apache Jena riot
        run: |
          JENA_VERSION=5.1.0
          curl -fL --retry 3 --retry-delay 5 \
            -o /tmp/jena.tar.gz \
            "https://archive.apache.org/dist/jena/binaries/apache-jena-${JENA_VERSION}.tar.gz"
          tar -xzf /tmp/jena.tar.gz -C /tmp
          echo "/tmp/apache-jena-${JENA_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Download IMF ontology
        run: |
          mkdir -p tests/testdata
          curl -fL --retry 3 --retry-delay 5 \
            -o tests/testdata/imf.ttl \
            "https://gitlab.com/imf-lab/spec/imf-ontology/-/raw/develop/owl/imf-ontology.owl.ttl?inline=false"
      - name: Download Gene Ontology (dated release) and convert to Turtle
        run: |
          curl -fL --retry 3 --retry-delay 5 \
            -o tests/testdata/go.owl.xml \
            "https://release.geneontology.org/2026-06-19/ontology/go.owl"
          riot --output=TURTLE tests/testdata/go.owl.xml > tests/testdata/go.ttl
          rm tests/testdata/go.owl.xml
      - name: Build performance test binary (release)
        run: cargo test --test performance --release --no-run
      - name: Run IMF performance tests
        run: cargo test --test performance --release imf -- --nocapture
      - name: Run Gene Ontology performance tests
        run: cargo test --test performance --release gene_ontology -- --ignored --nocapture

