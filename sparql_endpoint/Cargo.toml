[package]
name = "sparql-endpoint"
version = "0.1.0"
edition = "2024"

[dependencies]
dag-rdf = { path = "../dag_rdf" }
datalog = { path = "../datalog" }
datalog-parser = { path = "../datalog_parser" }
ingress = { path = "../ingress" }
shacl = { path = "../shacl" }
sparql-parser = { path = "../sparql_parser" }
turtle = { path = "../turtle" }
vqs-index = { path = "../vqs_index" }
jsonld-parser = { path = "../jsonld_parser" }
rml = { path = "../rml" }
ottr = { path = "../ottr" }
log = "0.4"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1.52", features = ["full"] }
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.7", features = ["cors", "timeout"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
urlencoding = "2"
subtle = "2"
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
reqwest = { version = "0.13", features = ["json", "blocking"] }
url = "2"
redb = "4"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
utoipa = "5.5"
utoipa-swagger-ui = { version = "9.0", features = ["axum", "vendored"] }

[dev-dependencies]
owl2rl2datalog = { path = "../owl2rl2datalog" }
rdf-owl-translator = { path = "../rdf_owl_translator" }
reqwest = { version = "0.13", features = ["json", "multipart"] }
urlencoding = "2"
thirtyfour = { version = "0.37", default-features = false, features = ["reqwest", "rustls"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
wiremock = "0.6"
rsa = "0.9"
rand = "0.10"
base64 = "0.21"
tempfile = "3"
